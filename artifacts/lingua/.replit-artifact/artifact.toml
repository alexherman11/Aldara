kind = "web"
previewPath = "/"
title = "Lingua – Spanish Learning App"
version = "1.0.0"
id = "artifacts/lingua"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21587

[services.development]
run = "pnpm --filter @workspace/lingua run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lingua", "run", "build" ]
publicDir = "artifacts/lingua/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21587"
BASE_PATH = "/"
